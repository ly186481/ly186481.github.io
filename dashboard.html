<style>
:root{
  --navy:#0f1f3d; --navy-2:#16294d; --ivory:#f7f4ec; --card:#ffffff;
  --gold:#b8904f; --gold-dark:#8f6d38; --text:#1c2333; --sub:#6a7286;
  --pos:#2f7d4f; --neg:#b3413a; --line:#e7e2d5; --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ivory);color:var(--text);
  font-family:'Inter','Noto Sans KR',-apple-system,'Pretendard',sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px;}

.topnav{background:var(--navy);color:#e9e3d3;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.topnav .brand{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;letter-spacing:.3px;}
.topnav .navRight{display:flex;align-items:center;gap:10px;}
.topnav a.back{font-size:12px;color:#c9c2ac;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:20px;}
.topnav a.back:hover{border-color:var(--gold);color:#fff;}
#langToggle{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--navy);
  background:var(--gold);border:none;padding:7px 14px;border-radius:20px;cursor:pointer;}
#langToggle:hover{background:#c9a15f;}

header.hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:44px 24px 34px;margin-bottom:28px;}
header.hero .kicker{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;}
header.hero h1{font-family:'Playfair Display',serif;font-size:30px;margin:0 0 10px;line-height:1.25;}
header.hero p{margin:0;max-width:660px;color:#c9d0e0;font-size:14px;line-height:1.6;}
header.hero .updated{margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#93a0bf;}

.section-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--gold-dark);text-transform:uppercase;margin:36px 0 4px;}
.section-title{font-family:'Playfair Display',serif;font-size:20px;margin:0 0 16px;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
.kpi-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.kpi-value{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;}
.kpi-change{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;margin-top:6px;}
.pos{color:var(--pos);} .neg{color:var(--neg);} .neu{color:var(--sub);}

.chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;}
.chart-card h3{margin:0 0 4px;font-family:'Playfair Display',serif;font-size:15px;font-weight:600;}
.chart-card .note{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--sub);margin-bottom:14px;}
canvas{max-height:270px;}

.table-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 22px 18px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;padding:12px 10px 10px;border-bottom:2px solid var(--navy);color:var(--navy);
  font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;white-space:nowrap;}
th:hover{color:var(--gold-dark);}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:hover td{background:#faf8f2;}
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;letter-spacing:.3px;}
.tag.dom{background:#eaf0e9;color:var(--pos);}
.tag.intl{background:#f2e7d6;color:var(--gold-dark);}
.impact-up{color:var(--pos);font-weight:600;}
.impact-down{color:var(--neg);font-weight:600;}
.impact-mix{color:var(--sub);font-weight:600;}

.footnote{margin-top:24px;padding:16px 18px;background:#f2ede0;border:1px dashed var(--gold);border-radius:var(--radius);
  font-family:'JetBrains Mono',monospace;font-size:11px;color:#5d5137;line-height:1.7;}
.footnote b{color:#4a4025;}

footer.page{margin-top:36px;padding:18px 0 4px;border-top:1px solid var(--line);text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);}
footer.page a{color:var(--gold-dark);text-decoration:none;}

@media(max-width:768px){.kpi-row{grid-template-columns:repeat(2,1fr);}.chart-row{grid-template-columns:1fr;}}
</style>

  document.getElementById('c1_note').textContent = s.c1n;
  document.getElementById('c2_title').textContent = s.c2t;
  document.getElementById('c2_note').textContent = s.c2n;
  document.getElementById('c3_title').textContent = s.c3t;
  document.getElementById('c3_note').textContent = s.c3n;
  document.getElementById('c4_title').textContent = s.c4t;
  document.getElementById('c4_note').textContent = s.c4n;
  s.th.forEach((t,i)=> document.getElementById('th'+i).textContent = t);
  document.getElementById('t_footPortfolio').textContent = s.footPortfolio;
  document.getElementById('t_footnote').innerHTML = s.footnote;
}

function renderKPIs(){
  document.getElementById('kpiRow').innerHTML = KPIS[LANG].map(k=>`
    <div class="kpi-card">
      <div class="kpi-label">${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      <div class="kpi-change ${k.pos===true?'pos':k.pos===false?'neg':'neu'}">${k.change}</div>
    </div>`).join('');
}

function renderTable(rows){
  document.querySelector('#dataTable tbody').innerHTML = rows.map(r=>{
    const label = IMPACT_LABEL[LANG][r.impact];
    const cls = 'impact-'+r.impact;
    const tagCls = r.region==='dom'?'dom':'intl';
    const regionLabel = REGION_LABEL[LANG][r.region];
    return `<tr>
      <td><span class="tag ${tagCls}">${regionLabel}</span></td>
      <td>${r.name}</td><td class="mono">${r.value}</td><td class="mono">${r.change}</td>
      <td class="${cls}">${label}</td>
    </tr>`;
  }).join('');
}

document.querySelectorAll('#dataTable th').forEach(th=>{
  th.addEventListener('click', ()=>{
    const k = th.dataset.k;
    sortState.dir = (sortState.key===k) ? -sortState.dir : 1;
    sortState.key = k;
    renderTable([...TABLE[LANG]].sort((a,b)=>(a[k]>b[k]?1:-1)*sortState.dir));
  });
});

function baseOpts(extra={}){
  return Object.assign({responsive:true, animation:false,
    plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}}}, extra);
}

function buildCharts(){
  const L = CHART_LBL[LANG];

  charts.idx = new Chart(document.getElementById('idxChart'), {
    type:'line',
    data:{labels:DATES, datasets:[
      {label:L.kospi, data:KOSPI_NORM, borderColor:COLORS[0], backgroundColor:COLORS[0]+'18', tension:.25},
      {label:L.snp, data:SNP_NORM, borderColor:COLORS[1], backgroundColor:COLORS[1]+'18', tension:.25}
    ]},
    options: baseOpts({scales:{y:{title:{display:true,text:L.yIdx}}}})
  });

  charts.rate = new Chart(document.getElementById('rateChart'), {
    type:'line',
    data:{labels:DATES, datasets:[
      {label:L.bok, data:KR_RATE, borderColor:COLORS[0], stepped:true},
      {label:L.fed, data:US_RATE, borderColor:COLORS[1], stepped:true}
    ]},
    options: baseOpts({scales:{y:{title:{display:true,text:L.yPct}}}})
  });

  charts.fx = new Chart(document.getElementById('fxChart'), {
    type:'line',
    data:{labels:DATES, datasets:[{label:L.fx, data:FX, borderColor:COLORS[2], backgroundColor:COLORS[2]+'22', fill:true, tension:.25}]},
    options: baseOpts({scales:{y:{title:{display:true,text:L.yFx}}}})
  });

  charts.ktb = new Chart(document.getElementById('ktbChart'), {
    type:'line',
    data:{labels:KTB_DATES, datasets:[
      {label:L.k3, data:KTB_3Y, borderColor:COLORS[0], tension:.25},
      {label:L.k10, data:KTB_10Y, borderColor:COLORS[3], tension:.25}
    ]},
    options: baseOpts({scales:{y:{title:{display:true,text:L.yPct}}}})
  });
}

function updateChartLabels(){
  const L = CHART_LBL[LANG];
  charts.idx.data.datasets[0].label = L.kospi;
  charts.idx.data.datasets[1].label = L.snp;
  charts.idx.options.scales.y.title.text = L.yIdx;
  charts.idx.update();

  charts.rate.data.datasets[0].label = L.bok;
  charts.rate.data.datasets[1].label = L.fed;
  charts.rate.options.scales.y.title.text = L.yPct;
  charts.rate.update();

  charts.fx.data.datasets[0].label = L.fx;
  charts.fx.options.scales.y.title.text = L.yFx;
  charts.fx.update();

  charts.ktb.data.datasets[0].label = L.k3;
  charts.ktb.data.datasets[1].label = L.k10;
  charts.ktb.options.scales.y.title.text = L.yPct;
  charts.ktb.update();
}

function toggleLang(){
  LANG = (LANG === 'en') ? 'ko' : 'en';
  localStorage.setItem('dashLang', LANG);
  renderStatic();
  renderKPIs();
  sortState = {key:null, dir:1};
  renderTable(TABLE[LANG]);
  updateChartLabels();
}

renderStatic();
renderKPIs();
renderTable(TABLE[LANG]);
buildCharts();
</script>
</body>
</html>
