<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macro Dashboard by Country — Li Yu</title>
<meta name="description" content="Country-by-country macro indicators relevant to equity markets — Korea, US, Japan, China/HK, Eurozone, UK. Li Yu, Economic Research & Strategy">

<style>
:root{
  --navy:#0f1f3d; --navy-2:#16294d; --ivory:#f7f4ec; --card:#ffffff;
  --gold:#b8904f; --gold-dark:#8f6d38; --text:#1c2333; --sub:#6a7286;
  --pos:#2f7d4f; --neg:#b3413a; --line:#e7e2d5; --radius:10px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ivory);color:var(--text);
  font-family:'Inter','Noto Sans KR',-apple-system,'Pretendard',sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 60px;}

.topnav{background:var(--navy);color:#e9e3d3;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.topnav .brand{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;letter-spacing:.3px;}
.topnav .navRight{display:flex;align-items:center;gap:10px;}
.topnav a.back{font-size:12px;color:#c9c2ac;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:6px 12px;border-radius:20px;}
.topnav a.back:hover{border-color:var(--gold);color:#fff;}
#langToggle{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.5px;color:var(--navy);
  background:var(--gold);border:none;padding:7px 14px;border-radius:20px;cursor:pointer;}
#langToggle:hover{background:#c9a15f;}

header.hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:44px 24px 34px;margin-bottom:22px;}
header.hero .kicker{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-bottom:10px;}
header.hero h1{font-family:'Playfair Display',serif;font-size:30px;margin:0 0 10px;line-height:1.25;}
header.hero p{margin:0;max-width:680px;color:#c9d0e0;font-size:14px;line-height:1.6;}
header.hero .updated{margin-top:16px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#93a0bf;}
#liveBadge{display:inline-block;margin-left:10px;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.3px;}
#liveBadge.live{background:#1f4d33;color:#8ee6ae;}
#liveBadge.static{background:#4a4025;color:#e8c77e;}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;margin-bottom:6px;-webkit-overflow-scrolling:touch;}
.tab{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.3px;white-space:nowrap;
  background:var(--card);color:var(--navy);border:1px solid var(--line);padding:10px 18px;border-radius:26px;cursor:pointer;}
.tab:hover{border-color:var(--gold);}
.tab.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 0 0 2px var(--gold) inset;}
.tab .flag{margin-right:6px;font-size:14px;}

.country-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:22px 0 4px;}
.country-head h2{font-family:'Playfair Display',serif;font-size:24px;margin:0;}
.country-head .tagline{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);}

.section-label{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;color:var(--gold-dark);text-transform:uppercase;margin:30px 0 4px;}
.section-title{font-family:'Playfair Display',serif;font-size:19px;margin:0 0 14px;}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;}
.kpi-label{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.kpi-value{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;}
.kpi-change{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;margin-top:6px;}
.kpi-src{position:absolute;top:10px;right:12px;width:7px;height:7px;border-radius:50%;}
.kpi-src.live{background:#2f9e5e;}
.kpi-src.stale{background:#c99a3a;}
.kpi-src.manual{background:#9aa3b5;}
.pos{color:var(--pos);} .neg{color:var(--neg);} .neu{color:var(--sub);}

.chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px;margin-bottom:16px;}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;}
.chart-card h3{margin:0 0 4px;font-family:'Playfair Display',serif;font-size:15px;font-weight:600;}
.chart-card .note{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--sub);margin-bottom:14px;}
canvas{max-height:260px;}

.table-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 22px 18px;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;padding:12px 10px 10px;border-bottom:2px solid var(--navy);color:var(--navy);
  font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;white-space:nowrap;}
th:hover{color:var(--gold-dark);}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:hover td{background:#faf8f2;}
.impact-up{color:var(--pos);font-weight:600;}
.impact-down{color:var(--neg);font-weight:600;}
.impact-mix{color:var(--sub);font-weight:600;}

.banner{margin-top:18px;padding:12px 16px;background:#f2ede0;border-left:3px solid var(--gold);border-radius:6px;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:#5d5137;line-height:1.7;}
.disclaimer{margin-top:14px;padding:0 2px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--sub);
  text-align:center;line-height:1.6;}
.footnote{margin-top:28px;padding:16px 18px;background:#f2ede0;border:1px dashed var(--gold);border-radius:var(--radius);
  font-family:'JetBrains Mono',monospace;font-size:11px;color:#5d5137;line-height:1.7;}
.footnote b{color:#4a4025;}

footer.page{margin-top:36px;padding:18px 0 4px;border-top:1px solid var(--line);text-align:center;
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--sub);}
footer.page a{color:var(--gold-dark);text-decoration:none;}

@media(max-width:768px){.kpi-row{grid-template-columns:repeat(2,1fr);}.chart-row{grid-template-columns:1fr;}}
</style>
</head>

}
function fmtNum(n){
  if (n === null || n === undefined) return 'n/a';
  const abs = Math.abs(n);
  const dec = abs >= 1000 ? 2 : abs >= 10 ? 3 : 4;
  return n.toLocaleString(undefined, {maximumFractionDigits: dec});
}
function pctChange(last, prev){
  if (prev === null || prev === undefined || prev === 0) return null;
  return ((last - prev) / prev) * 100;
}

/* ---------------- rendering ---------------- */
function opts(scales){
  return {responsive:true, animation:false, scales, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}}};
}

function renderStatic(){
  const s = STR[LANG];
  document.getElementById('htmlRoot').lang = LANG;
  document.getElementById('backLink').textContent = s.back;
  document.getElementById('langToggle').textContent = s.toggle;
  document.getElementById('t_kicker').textContent = s.kicker;
  document.getElementById('t_title').textContent = s.title;
  document.getElementById('t_desc').textContent = s.desc;
  document.getElementById('t_updated_text').textContent = s.updated;
  const badge = document.getElementById('liveBadge');
  if (LIVE && LIVE.generated_utc) {
    badge.textContent = s.live; badge.className = 'live';
  } else {
    badge.textContent = s.static; badge.className = 'static';
  }
  document.getElementById('t_footPortfolio').textContent = s.portfolio;
  document.getElementById('t_footnote').innerHTML = s.footnote;
  document.getElementById('t_disclaimer').textContent = s.disclaimer;
  document.getElementById('tabs').innerHTML = TAB_IDS.map(id =>
    `<button type="button" class="tab ${id===TAB?'active':''}" data-tab="${id}"><span class="flag">${V[id].flag}</span>${s.tabs[id]}</button>`).join('');
}

function kpiCardHtml(k){
  const live = liveFor(k.key);
  let value = k.v, change = k.c, dotClass = null;
  if (live) {
    value = fmtNum(live.last);
    const pct = pctChange(live.last, live.prev);
    change = (pct !== null ? (pct >= 0 ? '+' : '') + pct.toFixed(2) + '% · ' : '') + (live.asof || '');
    dotClass = live.stale ? 'stale' : (live.src === 'manual' ? 'manual' : 'live');
  }
  const sentiment = live ? (pctChange(live.last, live.prev) >= 0 ? true : false) : k.s;
  const dot = dotClass ? `<span class="kpi-src ${dotClass}" title="${dotClass}"></span>` : '';
  return `<div class="kpi-card">${dot}<div class="kpi-label">${k.l}</div><div class="kpi-value">${value}</div><div class="kpi-change ${sentiment===true?'pos':sentiment===false?'neg':'neu'}">${change}</div></div>`;
}

function tableRowHtml(r, plain){
  const s = STR[LANG];
  if (plain) {
    return '<tr>' + r.map((x,i)=>`<td class="${i>0&&i<4?'mono':''}">${x}</td>`).join('') + '</tr>';
  }
  const [n,v,c,imp,key] = r;
  const live = liveFor(key);
  let value = v, change = c;
  if (live) {
    value = fmtNum(live.last);
    const pct = pctChange(live.last, live.prev);
    change = (pct !== null ? (pct >= 0 ? '+' : '') + pct.toFixed(2) + '% ' : '') + '(' + (live.asof || '') + ')';
  }
  return `<tr><td>${n}</td><td class="mono">${value}</td><td class="mono">${change}</td><td class="impact-${imp}">${s.impact[imp]}</td></tr>`;
}

function renderTable(rows, head, plain){
  const body = rows.map(r => tableRowHtml(r, plain)).join('');
  return `<div class="table-card"><table><thead><tr>${head.map((h,i)=>`<th data-col="${i}">${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function attachSort(cfg){
  const rows = cfg.table[LANG];
  document.querySelectorAll('#view th').forEach(th => th.addEventListener('click', () => {
    const col = +th.dataset.col;
    sortState.dir = (sortState.col===col) ? -sortState.dir : 1;
    sortState.col = col;
    const sorted = [...rows].sort((a,b)=> (a[col]>b[col]?1:-1)*sortState.dir);
    const holder = document.querySelector('#view .table-card');
    const head = cfg.plainTable ? cfg.tableHead[LANG] : STR[LANG].th;
    holder.outerHTML = renderTable(sorted, head, !!cfg.plainTable);
    attachSort(cfg);
  }));
}

function renderView(){
  liveCharts.forEach(c => c.destroy()); liveCharts = [];
  const s = STR[LANG], cfg = V[TAB], L = CH[LANG];
  let html = `<div class="country-head"><h2>${cfg.flag} ${cfg.head[LANG]}</h2><span class="tagline">${cfg.tag[LANG]}</span></div>`;
  html += `<div class="section-label">${s.snap}</div><div class="section-title">${s.keyInd}</div><div class="kpi-row">` +
    cfg.kpis[LANG].map(kpiCardHtml).join('') + '</div>';
  if (cfg.charts) {
    html += `<div class="section-label">${s.trends}</div><div class="section-title">${s.trendTitle}</div><div class="chart-row">` +
      cfg.charts.map((c,i)=>`<div class="chart-card"><h3>${c.t[LANG]}</h3><div class="note">${c.n[LANG]}</div><canvas id="ch${i}"></canvas></div>`).join('') + '</div>';
  }
  html += `<div class="section-label">${s.detail}</div><div class="section-title">${s.sumTitle}</div>`;
  const head = cfg.plainTable ? cfg.tableHead[LANG] : s.th;
  html += renderTable(cfg.table[LANG], head, !!cfg.plainTable);
  if (cfg.banner) html += `<div class="banner">${cfg.banner[LANG]}</div>`;
  document.getElementById('view').innerHTML = html;
  if (cfg.charts) cfg.charts.forEach((c,i) => liveCharts.push(c.build(document.getElementById('ch'+i), L)));
  sortState = {col:null, dir:1};
  attachSort(cfg);
}

function setTab(id){
  if (TAB_IDS.indexOf(id) === -1) return;
  TAB = id;
  try { history.replaceState(null, '', '#' + id); } catch(e) {}
  renderStatic();
  renderView();
}

function toggleLang(){
  LANG = (LANG === 'en') ? 'ko' : 'en';
  try { localStorage.setItem('dashLang', LANG); } catch(e) {}
  renderStatic();
  renderView();
}

/* event delegation — robust against any single element being re-created */
document.getElementById('tabs').addEventListener('click', function(e){
  const btn = e.target.closest('.tab');
  if (btn && btn.dataset.tab) setTab(btn.dataset.tab);
});
document.getElementById('langToggle').addEventListener('click', toggleLang);
window.addEventListener('hashchange', function(){
  const h = (location.hash || '').replace('#','');
  if (TAB_IDS.indexOf(h) !== -1 && h !== TAB) setTab(h);
});

renderStatic();
renderView();

/* try to load live data (fails silently on file:// or if data/macro.json is absent) */
fetch('data/macro.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
  if (j && j.series && Object.keys(j.series).length) {
    LIVE = j;
    renderStatic();
    renderView();
  }
}).catch(function(){ /* static snapshot stays in place */ });
</script>
</body>
</html>
